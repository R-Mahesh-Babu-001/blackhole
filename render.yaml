services:
  # 1. FastAPI Python Web Service (Backend API)
  - type: web
    name: blackhole-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    autoDeploy: true

  # 2. React Static Site (Frontend SPA)
  - type: static
    name: blackhole-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        value: https://blackhole-foku.onrender.com
    autoDeploy: true

